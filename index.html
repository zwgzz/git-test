<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#f4f6fb">
<title>单词卡片 · 背单词小工具</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #f4f6fb;
    color: #23283a;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 20px 16px 40px;
  }
  .app { width: 100%; max-width: 520px; }

  header { text-align: center; margin-bottom: 16px; }
  header h1 { font-size: 22px; font-weight: 600; color: #2c3550; letter-spacing: .5px; }
  .subtitle { font-size: 12px; color: #8a93ab; margin-top: 5px; }

  .checkin {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 10px; padding: 6px 14px;
    background: #fff; border: 1px solid #e6eaf3; border-radius: 20px;
    font-size: 12px; color: #7a8299;
  }
  .checkin b { color: #e08a2e; font-size: 14px; }
  .checkin.done { background: #eaf7f0; border-color: #c6e9d6; color: #2f8f5f; }

  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1; padding: 9px 4px; border: 1px solid #e6eaf3; background: #fff;
    border-radius: 10px; font-size: 13px; color: #7a8299; cursor: pointer;
    font-family: inherit; transition: all .18s;
  }
  .tab.active { background: #5570f5; border-color: #5570f5; color: #fff; font-weight: 500; }

  .progress-wrap { margin-bottom: 16px; }
  .progress-text { display: flex; justify-content: space-between; font-size: 12px; color: #8a93ab; margin-bottom: 7px; }
  .progress-bar { height: 7px; background: #e3e8f2; border-radius: 8px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: #5570f5; border-radius: 8px; transition: width .4s ease; }

  .card-area { perspective: 1400px; margin-bottom: 20px; }
  .card {
    position: relative; width: 100%; height: 300px;
    transform-style: preserve-3d;
    transition: transform .55s cubic-bezier(.2,.8,.3,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: #fff; border: 1px solid #e6eaf3; border-radius: 20px;
    box-shadow: 0 10px 34px rgba(35,45,80,.07);
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 28px 26px; text-align: center;
  }
  .face.back { transform: rotateY(180deg); }
  .word { font-size: 42px; font-weight: 600; color: #2c3550; word-break: break-word; line-height: 1.2; }
  .phonetic { font-size: 16px; color: #8a93ab; margin-top: 8px; }
  .speak-btn {
    margin-top: 16px; display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 16px; border-radius: 20px; border: 1px solid #dde3f0;
    background: #f7f9fe; color: #5570f5; font-size: 13px; cursor: pointer;
    font-family: inherit; transition: background .18s;
  }
  .speak-btn:hover { background: #eef1ff; }
  .hint { font-size: 12px; color: #b3bacb; margin-top: 26px; }

  .pos {
    display: inline-block; font-size: 12px; color: #5570f5;
    background: #eef1ff; padding: 3px 11px; border-radius: 20px; margin-bottom: 12px;
  }
  .meaning { font-size: 25px; font-weight: 600; color: #2c3550; line-height: 1.4; }
  .example { font-size: 13.5px; color: #5b647d; margin-top: 18px; line-height: 1.65; }
  .translation { font-size: 12.5px; color: #9aa2b8; margin-top: 7px; line-height: 1.6; }

  .controls { display: flex; gap: 10px; }
  button { font-family: inherit; transition: transform .12s, opacity .2s; }
  button:active { transform: scale(.975); }
  .btn-flip, .btn-know, .btn-unknow, .btn-secondary {
    flex: 1; padding: 15px; border: none; border-radius: 13px;
    font-size: 15px; font-weight: 500; cursor: pointer;
  }
  .btn-flip { background: #5570f5; color: #fff; }
  .btn-know { background: #2fae72; color: #fff; }
  .btn-unknow { background: #fff; color: #e08a2e; border: 1px solid #f0c88a; }
  .btn-secondary {
    background: #fff; color: #5570f5; border: 1px solid #d5ddf5;
    font-size: 13px; padding: 12px; margin-top: 12px; flex: none; width: 100%;
  }

  .stats { margin-top: 18px; display: flex; justify-content: center; gap: 22px; font-size: 12.5px; color: #8a93ab; }
  .stats b { color: #2c3550; font-size: 15px; margin-left: 3px; }

  .reset {
    display: block; margin: 16px auto 0; background: none; border: none;
    color: #a8afc2; font-size: 12px; cursor: pointer; padding: 6px;
  }
  .reset:hover { color: #5570f5; }

  .done { text-align: center; padding: 46px 20px 30px; }
  .done h2 { font-size: 23px; color: #2c3550; margin-bottom: 12px; }
  .done p { color: #7a8299; font-size: 13.5px; line-height: 1.9; }
  .hidden { display: none !important; }

  @media (max-width: 480px) {
    body { padding: 14px 12px 32px; }
    .word { font-size: 34px; }
    .card { height: 268px; }
    .meaning { font-size: 21px; }
    .example { font-size: 12.5px; }
    .btn-flip, .btn-know, .btn-unknow { padding: 14px 8px; font-size: 14px; }
    .stats { gap: 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>单词卡片</h1>
    <div class="subtitle">看单词 · 翻面释义 · 记住它</div>
    <div class="checkin" id="checkin"><span id="checkinText">今日未打卡</span></div>
  </header>

  <div class="tabs" id="tabs">
    <button class="tab" data-level="basic">基础</button>
    <button class="tab" data-level="medium">进阶</button>
    <button class="tab" data-level="advanced">高级</button>
    <button class="tab active" data-level="all">全部</button>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-text">
      <span id="progressLabel">第 1 / 1 个</span>
      <span id="progressPercent">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="card-area" id="cardArea">
    <div class="card" id="card">
      <div class="face front">
        <div class="word" id="word">word</div>
        <div class="phonetic" id="phonetic"></div>
        <button class="speak-btn" id="btnSpeak">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
          朗读发音
        </button>
        <div class="hint">点击卡片查看释义</div>
      </div>
      <div class="face back">
        <div class="pos" id="pos"></div>
        <div class="meaning" id="meaning"></div>
        <div class="example" id="example"></div>
        <div class="translation" id="translation"></div>
      </div>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="btn-flip" id="btnFlip">显示释义</button>
    <button class="btn-know hidden" id="btnKnow">认识</button>
    <button class="btn-unknow hidden" id="btnUnknow">不认识</button>
  </div>

  <button class="btn-secondary" id="btnReviewWrong">复习错词本</button>

  <div class="stats">
    <span>认识 <b id="statKnow">0</b></span>
    <span>不认识 <b id="statUnknow">0</b></span>
    <span>错词本 <b id="statWrong">0</b></span>
  </div>

  <button class="reset" id="btnReset">重新开始本轮</button>
</div>

<script>
  const WORDS = [
    { word:'benefit', phonetic:'/ˈbenɪfɪt/', pos:'n./v.', meaning:'益处；受益', example:'Exercise has many health benefits.', translation:'锻炼对健康有很多好处。', level:'basic' },
    { word:'campaign', phonetic:'/kæmˈpeɪn/', pos:'n.', meaning:'运动；活动', example:'They launched a campaign to save the park.', translation:'他们发起了一场保护公园的活动。', level:'basic' },
    { word:'decline', phonetic:'/dɪˈklaɪn/', pos:'v./n.', meaning:'下降；婉拒', example:'Sales declined sharply last month.', translation:'上个月销售额急剧下降。', level:'basic' },
    { word:'efficient', phonetic:'/ɪˈfɪʃnt/', pos:'adj.', meaning:'高效的', example:'This is a more efficient way to work.', translation:'这是一种更高效的工作方式。', level:'basic' },
    { word:'familiar', phonetic:'/fəˈmɪliə/', pos:'adj.', meaning:'熟悉的', example:'I am familiar with this software.', translation:'我熟悉这个软件。', level:'basic' },
    { word:'generate', phonetic:'/ˈdʒenəreɪt/', pos:'v.', meaning:'产生；生成', example:'The plan will generate new jobs.', translation:'这个计划将创造新的就业机会。', level:'basic' },
    { word:'hesitate', phonetic:'/ˈhezɪteɪt/', pos:'v.', meaning:'犹豫', example:'Do not hesitate to ask for help.', translation:'不要犹豫，尽管求助。', level:'basic' },
    { word:'identify', phonetic:'/aɪˈdentɪfaɪ/', pos:'v.', meaning:'识别；确认', example:'Can you identify the problem?', translation:'你能找出问题所在吗？', level:'basic' },
    { word:'maintain', phonetic:'/meɪnˈteɪn/', pos:'v.', meaning:'维持；保养', example:'It is important to maintain a balance.', translation:'保持平衡很重要。', level:'basic' },
    { word:'obvious', phonetic:'/ˈɒbviəs/', pos:'adj.', meaning:'明显的', example:'The answer is quite obvious.', translation:'答案相当明显。', level:'basic' },

    { word:'abandon', phonetic:'/əˈbændən/', pos:'v.', meaning:'放弃；抛弃', example:'He had to abandon his car in the snow.', translation:'他不得不把车遗弃在雪地里。', level:'medium' },
    { word:'justify', phonetic:'/ˈdʒʌstɪfaɪ/', pos:'v.', meaning:'证明…正当', example:'How do you justify this decision?', translation:'你如何证明这个决定是合理的？', level:'medium' },
    { word:'negotiate', phonetic:'/nɪˈɡəʊʃieɪt/', pos:'v.', meaning:'谈判；协商', example:'They are negotiating a new contract.', translation:'他们正在协商一份新合同。', level:'medium' },
    { word:'participate', phonetic:'/pɑːˈtɪsɪpeɪt/', pos:'v.', meaning:'参与', example:'Everyone can participate in the discussion.', translation:'每个人都可以参与讨论。', level:'medium' },
    { word:'quality', phonetic:'/ˈkwɒləti/', pos:'n.', meaning:'质量', example:'We focus on quality, not quantity.', translation:'我们注重质量，而非数量。', level:'medium' },
    { word:'reduce', phonetic:'/rɪˈdjuːs/', pos:'v.', meaning:'减少', example:'We need to reduce costs.', translation:'我们需要降低成本。', level:'medium' },
    { word:'significant', phonetic:'/sɪɡˈnɪfɪkənt/', pos:'adj.', meaning:'重要的；显著的', example:'There was a significant improvement.', translation:'有显著的改善。', level:'medium' },
    { word:'temporary', phonetic:'/ˈtemprəri/', pos:'adj.', meaning:'临时的', example:'This is a temporary solution.', translation:'这是个临时方案。', level:'medium' },
    { word:'urgent', phonetic:'/ˈɜːdʒənt/', pos:'adj.', meaning:'紧急的', example:'I have an urgent matter to handle.', translation:'我有件紧急的事要处理。', level:'medium' },
    { word:'willing', phonetic:'/ˈwɪlɪŋ/', pos:'adj.', meaning:'愿意的', example:'She is willing to help others.', translation:'她愿意帮助别人。', level:'medium' },

    { word:'accumulate', phonetic:'/əˈkjuːmjəleɪt/', pos:'v.', meaning:'积累；积聚', example:'Dust had accumulated on the shelves.', translation:'架子上积了一层灰。', level:'advanced' },
    { word:'compensate', phonetic:'/ˈkɒmpenseɪt/', pos:'v.', meaning:'补偿；弥补', example:'Nothing can compensate for the loss.', translation:'任何东西都无法弥补这个损失。', level:'advanced' },
    { word:'deteriorate', phonetic:'/dɪˈtɪəriəreɪt/', pos:'v.', meaning:'恶化；变坏', example:'Her health deteriorated rapidly.', translation:'她的健康状况迅速恶化。', level:'advanced' },
    { word:'elaborate', phonetic:'/ɪˈlæbərət/', pos:'adj./v.', meaning:'精心制作的；详述', example:'Could you elaborate on that point?', translation:'你能详细说明那一点吗？', level:'advanced' },
    { word:'fluctuate', phonetic:'/ˈflʌktʃueɪt/', pos:'v.', meaning:'波动；起伏', example:'Prices fluctuate with the seasons.', translation:'价格随季节波动。', level:'advanced' },
    { word:'inevitable', phonetic:'/ɪnˈevɪtəbl/', pos:'adj.', meaning:'不可避免的', example:'Change is inevitable in life.', translation:'变化在生活中不可避免。', level:'advanced' },
    { word:'prevail', phonetic:'/prɪˈveɪl/', pos:'v.', meaning:'盛行；占优势', example:'Justice will prevail in the end.', translation:'正义终将获胜。', level:'advanced' },
    { word:'reinforce', phonetic:'/ˌriːɪnˈfɔːs/', pos:'v.', meaning:'加强；强化', example:'The news reinforced my belief.', translation:'这个消息坚定了我的信念。', level:'advanced' },
    { word:'sophisticated', phonetic:'/səˈfɪstɪkeɪtɪd/', pos:'adj.', meaning:'复杂的；老练的', example:'It is a sophisticated piece of software.', translation:'这是一款复杂的软件。', level:'advanced' },
    { word:'undermine', phonetic:'/ˌʌndəˈmaɪn/', pos:'v.', meaning:'削弱；暗中破坏', example:'Criticism can undermine confidence.', translation:'批评会削弱信心。', level:'advanced' }
  ];

  let queue = [];
  let index = 0;
  let knowCount = 0;
  let unknowCount = 0;
  let flipped = false;
  let currentMode = { type: 'all' };

  const $ = id => document.getElementById(id);
  const KEY_STREAK = 'wc_streak';
  const KEY_WRONG = 'wc_wrong';

  function storageGet(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  }
  function storageSet(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
  }

  function dateStr(offset) {
    const d = new Date();
    d.setDate(d.getDate() + (offset || 0));
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function getWrong() { return storageGet(KEY_WRONG, []); }
  function saveWrong(arr) { storageSet(KEY_WRONG, arr); }

  function addWrong(word) {
    const arr = getWrong();
    if (arr.indexOf(word) === -1) { arr.push(word); saveWrong(arr); }
    renderStats();
  }
  function removeWrong(word) {
    saveWrong(getWrong().filter(w => w !== word));
    renderStats();
  }

  function renderCheckin() {
    const data = storageGet(KEY_STREAK, { streak: 0, lastDate: '' });
    const today = dateStr(0);
    const el = $('checkin');
    const txt = $('checkinText');
    if (data.lastDate === today) {
      el.classList.add('done');
      txt.innerHTML = '今日已打卡 · 连续 <b>' + data.streak + '</b> 天';
    } else {
      el.classList.remove('done');
      txt.innerHTML = data.streak > 0
        ? '连续 <b>' + data.streak + '</b> 天 · 今天还没打卡'
        : '今日未打卡 · 学一个词就算打卡';
    }
  }

  function recordStudy() {
    const data = storageGet(KEY_STREAK, { streak: 0, lastDate: '' });
    const today = dateStr(0);
    if (data.lastDate === today) return;
    const yesterday = dateStr(-1);
    data.streak = (data.lastDate === yesterday) ? (data.streak + 1) : 1;
    data.lastDate = today;
    storageSet(KEY_STREAK, data);
    renderCheckin();
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) {
      alert('当前浏览器不支持语音朗读，建议用 Chrome 或 Edge 打开。');
      return;
    }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }

  function buildQueue() {
    if (currentMode.type === 'wrong') {
      const wrongList = getWrong();
      return shuffle(WORDS.filter(w => wrongList.indexOf(w.word) !== -1));
    }
    if (currentMode.type === 'level') {
      return shuffle(WORDS.filter(w => w.level === currentMode.level));
    }
    return shuffle(WORDS);
  }

  function clearDone() {
    const old = $('doneArea');
    if (old) old.remove();
    $('cardArea').classList.remove('hidden');
    $('controls').classList.remove('hidden');
    $('progressWrap').classList.remove('hidden');
  }

  function startStudy(mode) {
    currentMode = mode;
    clearDone();
    queue = buildQueue();
    index = 0;
    knowCount = 0;
    unknowCount = 0;
    if (queue.length === 0) {
      $('cardArea').classList.add('hidden');
      $('controls').classList.add('hidden');
      $('progressWrap').classList.add('hidden');
      const area = document.createElement('div');
      area.className = 'done';
      area.id = 'doneArea';
      area.innerHTML = '<h2>错词本是空的</h2><p>先去学几个词，遇到不认识的会自动收进这里。</p>';
      document.querySelector('.app').insertBefore(area, $('btnReviewWrong'));
      renderStats();
      return;
    }
    showCurrent();
  }

  function showCurrent() {
    const w = queue[index];
    $('word').textContent = w.word;
    $('phonetic').textContent = w.phonetic;
    $('pos').textContent = w.pos;
    $('meaning').textContent = w.meaning;
    $('example').textContent = w.example;
    $('translation').textContent = w.translation;
    $('card').classList.remove('flipped');
    flipped = false;
    $('btnFlip').classList.remove('hidden');
    $('btnKnow').classList.add('hidden');
    $('btnUnknow').classList.add('hidden');
    const pct = Math.round(index / queue.length * 100);
    $('progressLabel').textContent = '第 ' + (index + 1) + ' / ' + queue.length + ' 个';
    $('progressPercent').textContent = pct + '%';
    $('progressFill').style.width = pct + '%';
    renderStats();
  }

  function renderStats() {
    $('statKnow').textContent = knowCount;
    $('statUnknow').textContent = unknowCount;
    $('statWrong').textContent = getWrong().length;
  }

  function flip() {
    flipped = !flipped;
    $('card').classList.toggle('flipped', flipped);
    $('btnFlip').classList.toggle('hidden', flipped);
    $('btnKnow').classList.toggle('hidden', !flipped);
    $('btnUnknow').classList.toggle('hidden', !flipped);
  }

  function next(known) {
    const w = queue[index];
    recordStudy();
    if (known) {
      knowCount++;
      if (currentMode.type === 'wrong') removeWrong(w.word);
    } else {
      unknowCount++;
      addWrong(w.word);
    }
    index++;
    if (index >= queue.length) showDone();
    else showCurrent();
  }

  function showDone() {
    $('cardArea').classList.add('hidden');
    $('controls').classList.add('hidden');
    $('progressWrap').classList.add('hidden');
    const data = storageGet(KEY_STREAK, { streak: 0, lastDate: '' });
    const area = document.createElement('div');
    area.className = 'done';
    area.id = 'doneArea';
    area.innerHTML =
      '<h2>本轮完成</h2>' +
      '<p>认识 ' + knowCount + ' 个，不认识 ' + unknowCount + ' 个。<br>' +
      '错词本现在有 ' + getWrong().length + ' 个词。<br>' +
      '已连续打卡 ' + data.streak + ' 天。</p>';
    document.querySelector('.app').insertBefore(area, $('btnReviewWrong'));
    renderStats();
  }

  $('card').addEventListener('click', () => { if (!flipped) flip(); });
  $('btnSpeak').addEventListener('click', (e) => {
    e.stopPropagation();
    if (queue[index]) speak(queue[index].word);
  });
  $('btnFlip').addEventListener('click', (e) => { e.stopPropagation(); flip(); });
  $('btnKnow').addEventListener('click', (e) => { e.stopPropagation(); next(true); });
  $('btnUnknow').addEventListener('click', (e) => { e.stopPropagation(); next(false); });

  $('btnReviewWrong').addEventListener('click', () => {
    if (getWrong().length === 0) {
      alert('错词本还是空的，先学几个词吧。');
      return;
    }
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    startStudy({ type: 'wrong' });
  });

  $('btnReset').addEventListener('click', () => {
    startStudy(currentMode);
  });

  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const level = tab.dataset.level;
      startStudy(level === 'all' ? { type: 'all' } : { type: 'level', level: level });
    });
  });

  renderCheckin();
  renderStats();
  startStudy({ type: 'all' });
</script>
</body>
</html>
